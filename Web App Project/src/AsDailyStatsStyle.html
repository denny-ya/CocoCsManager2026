<style>
  .as-daily-page {
    min-height: 100vh;
    background:
      radial-gradient(circle at top left, rgba(48, 99, 180, 0.16), transparent 34%),
      linear-gradient(180deg, #f7f9fd 0%, #eef3fa 100%);
    color: #152238;
  }

  .as-daily-appbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 18px 20px;
    background: linear-gradient(135deg, #2558a6 0%, #1d4382 100%);
    color: #fff;
    box-shadow: 0 10px 28px rgba(29, 67, 130, 0.22);
  }

  .as-daily-back-btn {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .as-daily-back-btn .material-icons {
    font-size: 22px;
  }

  .as-daily-eyebrow {
    font-size: 12px;
    font-weight: 700;
    opacity: 0.8;
    letter-spacing: 0.03em;
  }

  .as-daily-title {
    margin: 2px 0 0;
    font-size: 21px;
    line-height: 1.2;
    font-weight: 800;
  }

  .as-daily-content {
    padding: 16px;
    max-width: 900px;
    margin: 0 auto;
  }

  .as-daily-filter-card,
  .as-daily-summary-card,
  .as-daily-row-card {
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid rgba(141, 159, 188, 0.24);
    border-radius: 22px;
    box-shadow: 0 14px 34px rgba(31, 56, 88, 0.08);
  }

  .as-daily-filter-card {
    padding: 14px;
    margin-bottom: 14px;
  }

  .as-daily-filter-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .as-daily-field {
    display: grid;
    gap: 6px;
    font-size: 12px;
    font-weight: 800;
    color: #4a5c76;
  }

  .as-daily-field input,
  .as-daily-field select {
    width: 100%;
    min-height: 44px;
    border: 1px solid #d8e1ef;
    border-radius: 13px;
    background: #fff;
    color: #152238;
    font-size: 15px;
    font-weight: 700;
    padding: 0 12px;
    box-sizing: border-box;
    outline: none;
  }

  .as-daily-field input:focus,
  .as-daily-field select:focus {
    border-color: #2f5aa6;
    box-shadow: 0 0 0 3px rgba(47, 90, 166, 0.12);
  }

  .as-daily-search-btn {
    width: 100%;
    height: 48px;
    border: 0;
    border-radius: 15px;
    margin-top: 12px;
    background: #2f5aa6;
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(47, 90, 166, 0.22);
  }

  .as-daily-search-btn .material-icons {
    font-size: 21px;
  }

  .as-daily-filter-note {
    margin: 10px 2px 0;
    color: #75859b;
    font-size: 12px;
    line-height: 1.45;
  }

  .as-daily-summary {
    margin-bottom: 18px;
  }

  .as-daily-download-area {
    margin: -4px 0 18px;
  }

  .as-daily-download-btn {
    width: 100%;
    min-height: 46px;
    border: 1px solid rgba(47, 90, 166, 0.26);
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.94);
    color: #2f5aa6;
    font-size: 14px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(31, 56, 88, 0.08);
  }

  .as-daily-download-btn .material-icons {
    font-size: 20px;
  }

  .as-daily-download-btn:disabled {
    cursor: wait;
    opacity: 0.72;
  }

  .as-daily-download-note {
    margin: 7px 4px 0;
    color: #78889d;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.4;
    text-align: center;
  }

  .as-daily-summary-card {
    overflow: hidden;
  }

  .as-daily-summary-hero {
    padding: 18px;
    background:
      linear-gradient(135deg, rgba(47, 90, 166, 0.96), rgba(35, 76, 145, 0.96)),
      radial-gradient(circle at 85% 20%, rgba(255, 255, 255, 0.32), transparent 24%);
    color: #fff;
  }

  .as-daily-summary-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
  }

  .as-daily-summary-label {
    font-size: 13px;
    font-weight: 800;
    opacity: 0.78;
  }

  .as-daily-summary-name {
    margin-top: 3px;
    font-size: 22px;
    font-weight: 900;
    word-break: keep-all;
  }

  .as-daily-summary-date {
    flex-shrink: 0;
    padding: 7px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
    font-size: 12px;
    font-weight: 800;
  }

  .as-daily-primary-kpis {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 16px;
  }

  .as-daily-primary-kpis-heavy {
    grid-template-columns: repeat(4, 1fr);
  }

  .as-daily-primary-kpi {
    padding: 12px 8px;
    border: 0;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.14);
    color: inherit;
    font-family: inherit;
    text-align: center;
    box-sizing: border-box;
  }

  .as-daily-primary-kpi-button {
    width: 100%;
    cursor: pointer;
    transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
  }

  .as-daily-primary-kpi-button::after {
    content: '';
    display: block;
    width: 28px;
    height: 3px;
    margin: 6px auto 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.34);
  }

  .as-daily-primary-kpi-button:active {
    transform: scale(0.985);
  }

  .as-daily-primary-kpi-button:focus-visible {
    outline: 3px solid rgba(255, 255, 255, 0.28);
    outline-offset: 3px;
  }

  .as-daily-primary-kpi span {
    display: block;
    font-size: 11px;
    font-weight: 800;
    opacity: 0.78;
  }

  .as-daily-primary-kpi strong {
    display: block;
    margin-top: 3px;
    font-size: 22px;
    line-height: 1.1;
    font-weight: 900;
  }

  .as-daily-kpi-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 14px;
  }

  .as-daily-kpi-grid-heavy {
    grid-template-columns: repeat(4, 1fr);
  }

  .as-daily-kpi-box {
    min-height: 72px;
    padding: 12px;
    border-radius: 16px;
    background: #f5f7fb;
    box-sizing: border-box;
  }

  .as-daily-kpi-box-button {
    width: 100%;
    border: 0;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }

  .as-daily-kpi-box-button::after {
    content: '';
    display: block;
    width: 34px;
    height: 3px;
    margin-top: 4px;
    border-radius: 999px;
    background: rgba(47, 90, 166, 0.28);
  }

  .as-daily-kpi-box-button.warning::after {
    background: rgba(194, 59, 49, 0.34);
  }

  .as-daily-kpi-box-button:active {
    transform: scale(0.985);
  }

  .as-daily-kpi-box-button:focus-visible {
    outline: 3px solid rgba(47, 90, 166, 0.22);
    outline-offset: 3px;
  }

  .as-daily-kpi-box span {
    display: block;
    color: #63748d;
    font-size: 12px;
    font-weight: 800;
  }

  .as-daily-kpi-box strong {
    display: block;
    margin-top: 4px;
    color: #16243a;
    font-size: 20px;
    font-weight: 900;
  }

  .as-daily-kpi-box.warning strong {
    color: #c23b31;
  }

  .as-daily-kpi-box.blue strong {
    color: #2f5aa6;
  }

  .as-daily-kpi-action {
    display: block;
    width: 100%;
    margin: 4px 0 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: #16243a;
    font: inherit;
    font-size: 20px;
    line-height: 1.2;
    font-weight: 900;
    text-align: left;
    cursor: pointer;
  }

  .as-daily-kpi-action::after {
    content: '';
    display: block;
    width: 34px;
    height: 3px;
    margin-top: 4px;
    border-radius: 999px;
    background: rgba(47, 90, 166, 0.28);
  }

  .as-daily-kpi-action.warning {
    color: #c23b31;
  }

  .as-daily-kpi-action.warning::after {
    background: rgba(194, 59, 49, 0.34);
  }

  .as-daily-kpi-action:focus-visible {
    outline: 3px solid rgba(47, 90, 166, 0.22);
    outline-offset: 3px;
    border-radius: 8px;
  }

  .as-daily-detail-section {
    padding-bottom: 24px;
  }

  .as-daily-section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 2px 10px;
    color: #26364d;
    font-size: 16px;
    font-weight: 900;
  }

  .as-daily-section-title small {
    color: #73839a;
    font-size: 12px;
    font-weight: 800;
  }

  .as-daily-rows {
    display: grid;
    gap: 10px;
  }

  .as-daily-accordion {
    --as-daily-tone: #2f5aa6;
    --as-daily-tone-soft: rgba(47, 90, 166, 0.08);
    --as-daily-tone-bg: rgba(47, 90, 166, 0.13);
    --as-daily-tone-line: rgba(47, 90, 166, 0.26);
    background:
      linear-gradient(135deg, var(--as-daily-tone-bg), rgba(255, 255, 255, 0.86) 62%),
      #fff;
    border: 1px solid rgba(141, 159, 188, 0.24);
    border-left: 5px solid var(--as-daily-tone);
    border-radius: 20px;
    box-shadow: 0 12px 28px rgba(31, 56, 88, 0.07);
    overflow: hidden;
  }

  .as-daily-tone-service1 {
    --as-daily-tone: #2f5aa6;
    --as-daily-tone-soft: rgba(47, 90, 166, 0.09);
    --as-daily-tone-bg: rgba(47, 90, 166, 0.15);
    --as-daily-tone-line: rgba(47, 90, 166, 0.28);
  }

  .as-daily-tone-service2 {
    --as-daily-tone: #25815f;
    --as-daily-tone-soft: rgba(37, 129, 95, 0.09);
    --as-daily-tone-bg: rgba(37, 129, 95, 0.15);
    --as-daily-tone-line: rgba(37, 129, 95, 0.28);
  }

  .as-daily-tone-service3 {
    --as-daily-tone: #c76a2a;
    --as-daily-tone-soft: rgba(199, 106, 42, 0.10);
    --as-daily-tone-bg: rgba(199, 106, 42, 0.16);
    --as-daily-tone-line: rgba(199, 106, 42, 0.30);
  }

  .as-daily-tone-service4 {
    --as-daily-tone: #6a5ab8;
    --as-daily-tone-soft: rgba(106, 90, 184, 0.09);
    --as-daily-tone-bg: rgba(106, 90, 184, 0.15);
    --as-daily-tone-line: rgba(106, 90, 184, 0.28);
  }

  .as-daily-tone-factory {
    --as-daily-tone: #b68114;
    --as-daily-tone-soft: rgba(182, 129, 20, 0.11);
    --as-daily-tone-bg: rgba(182, 129, 20, 0.17);
    --as-daily-tone-line: rgba(182, 129, 20, 0.32);
  }

  .as-daily-accordion-summary {
    display: block;
    padding: 14px;
    cursor: pointer;
    list-style: none;
  }

  .as-daily-accordion-summary::-webkit-details-marker {
    display: none;
  }

  .as-daily-row-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }

  .as-daily-row-title {
    font-size: 16px;
    font-weight: 900;
    color: #14233a;
    word-break: keep-all;
  }

  .as-daily-row-sub {
    margin-top: 3px;
    font-size: 12px;
    font-weight: 700;
    color: #76869b;
  }

  .as-daily-row-head-actions {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .as-daily-row-badge {
    padding: 6px 9px;
    border-radius: 999px;
    background: var(--as-daily-tone-soft);
    color: var(--as-daily-tone);
    font-size: 11px;
    font-weight: 900;
  }

  .as-daily-accordion-icon {
    width: 26px;
    height: 26px;
    border-radius: 999px;
    background: var(--as-daily-tone-soft);
    color: var(--as-daily-tone);
    font-size: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.18s ease;
  }

  .as-daily-accordion[open] .as-daily-accordion-icon {
    transform: rotate(180deg);
  }

  .as-daily-mini-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    overflow: hidden;
    border: 1px solid var(--as-daily-tone-line);
    border-radius: 15px;
  }

  .as-daily-mini-item {
    min-width: 0;
    padding: 10px 4px;
    text-align: center;
    background: #fff;
    border-right: 1px solid #e1e7f0;
  }

  .as-daily-mini-item:last-child {
    border-right: 0;
  }

  .as-daily-mini-item span {
    display: block;
    color: #718198;
    font-size: 11px;
    font-weight: 800;
  }

  .as-daily-mini-item strong {
    display: block;
    margin-top: 4px;
    color: #18263c;
    font-size: 16px;
    font-weight: 900;
  }

  .as-daily-mini-item.warning strong {
    color: #c23b31;
  }

  .as-daily-mini-item.blue strong {
    color: var(--as-daily-tone);
  }

  .as-daily-accordion-body {
    display: grid;
    gap: 8px;
    padding: 0 12px 12px;
    background: linear-gradient(180deg, rgba(245, 248, 253, 0.4), rgba(238, 243, 250, 0.85));
  }

  .as-daily-child-count {
    padding: 2px 4px;
    color: #75859b;
    font-size: 12px;
    font-weight: 800;
  }

  .as-daily-child-row {
    padding: 11px;
    border: 1px solid #e3e9f2;
    border-radius: 15px;
    background: #fff;
  }

  .as-daily-child-main {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 9px;
  }

  .as-daily-child-title {
    color: #14233a;
    font-size: 14px;
    font-weight: 900;
  }

  .as-daily-child-sub {
    margin-top: 2px;
    color: #7a8ba1;
    font-size: 11px;
    font-weight: 700;
  }

  .as-daily-child-main > span {
    flex-shrink: 0;
    padding: 4px 7px;
    border-radius: 999px;
    background: #f1f5fb;
    color: #5a6e88;
    font-size: 10px;
    font-weight: 900;
  }

  .as-daily-child-metrics {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
  }

  .as-daily-child-metrics div {
    min-width: 0;
    padding: 7px 3px;
    border-radius: 10px;
    background: #f7f9fc;
    text-align: center;
  }

  .as-daily-child-metrics span {
    display: block;
    color: #76869b;
    font-size: 10px;
    font-weight: 800;
  }

  .as-daily-child-metrics strong {
    display: block;
    margin-top: 3px;
    color: #14233a;
    font-size: 13px;
    font-weight: 900;
  }

  .as-daily-child-metrics .warning strong {
    color: #c23b31;
  }

  .as-daily-child-empty {
    padding: 14px;
    border-radius: 14px;
    background: #fff;
    color: #8796aa;
    font-size: 12px;
    font-weight: 800;
    text-align: center;
  }

  .as-daily-cumulative-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    overflow: hidden;
    border: 1px solid var(--as-daily-tone-line);
    border-radius: 16px;
    background:
      linear-gradient(180deg, var(--as-daily-tone-bg), rgba(255, 255, 255, 0.92) 58%),
      #fff;
  }

  .as-daily-cumulative-item {
    min-width: 0;
    padding: 11px 6px;
    text-align: center;
    border-right: 1px solid #dbe5f2;
  }

  .as-daily-cumulative-item:last-child {
    border-right: 0;
  }

  .as-daily-cumulative-item span {
    display: block;
    color: #718198;
    font-size: 10px;
    font-weight: 900;
  }

  .as-daily-cumulative-item strong {
    display: block;
    margin-top: 4px;
    color: #14233a;
    font-size: 16px;
    font-weight: 950;
    line-height: 1.1;
  }

  .as-daily-cumulative-item.blue strong {
    color: var(--as-daily-tone);
  }

  .as-daily-cumulative-item.warning strong {
    color: #c23b31;
  }

  .as-daily-detail-modal {
    position: fixed;
    inset: 0;
    z-index: 10000;
    align-items: flex-end;
    justify-content: center;
    background: rgba(15, 25, 42, 0.48);
    padding: 18px 12px;
    box-sizing: border-box;
  }

  .as-daily-detail-dialog {
    width: min(560px, 100%);
    max-height: min(78vh, 720px);
    border-radius: 24px;
    background: #f8fbff;
    box-shadow: 0 24px 64px rgba(15, 25, 42, 0.28);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .as-daily-detail-modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    padding: 18px;
    background:
      linear-gradient(135deg, #2f5aa6, #244783),
      radial-gradient(circle at top right, rgba(255, 255, 255, 0.24), transparent 32%);
    color: #fff;
  }

  .as-daily-detail-modal-meta {
    font-size: 12px;
    font-weight: 800;
    opacity: 0.78;
  }

  .as-daily-detail-modal-head h3 {
    margin: 4px 0 0;
    font-size: 19px;
    line-height: 1.25;
    font-weight: 900;
  }

  .as-daily-detail-close {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .as-daily-detail-close .material-icons {
    font-size: 21px;
  }

  .as-daily-detail-modal-body {
    overflow: auto;
    padding: 14px;
  }

  .as-daily-detail-loading,
  .as-daily-detail-empty {
    min-height: 160px;
    border: 1px dashed #cbd6e6;
    border-radius: 18px;
    background: #fff;
    color: #74849a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    font-size: 13px;
    font-weight: 800;
  }

  .as-daily-detail-empty .material-icons {
    color: #9dafc7;
    font-size: 30px;
  }

  .as-daily-detail-empty p {
    margin: 0;
  }

  .as-daily-detail-limit {
    margin-bottom: 10px;
    padding: 9px 11px;
    border-radius: 12px;
    background: #fff5df;
    color: #956112;
    font-size: 12px;
    font-weight: 800;
  }

  .as-daily-detail-list {
    display: grid;
    gap: 10px;
  }

  .as-daily-detail-group-list {
    display: grid;
    gap: 10px;
  }

  .as-daily-detail-group {
    border: 1px solid #dde6f3;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 8px 20px rgba(31, 56, 88, 0.06);
    overflow: hidden;
  }

  .as-daily-detail-group-summary {
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 14px;
    cursor: pointer;
  }

  .as-daily-detail-group-summary::-webkit-details-marker {
    display: none;
  }

  .as-daily-detail-group-summary span {
    display: block;
    color: #7a8ba1;
    font-size: 10px;
    font-weight: 900;
  }

  .as-daily-detail-group-summary strong {
    display: block;
    margin-top: 3px;
    color: #14233a;
    font-size: 16px;
    line-height: 1.25;
    font-weight: 900;
  }

  .as-daily-detail-group-meta {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .as-daily-detail-group-meta b {
    padding: 6px 9px;
    border-radius: 999px;
    background: #edf3ff;
    color: #2f5aa6;
    font-size: 12px;
    font-weight: 900;
  }

  .as-daily-detail-group-meta .material-icons {
    width: 28px;
    height: 28px;
    border-radius: 999px;
    background: #f2f5fb;
    color: #5f718d;
    font-size: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.18s ease;
  }

  .as-daily-detail-group[open] .as-daily-detail-group-meta .material-icons {
    transform: rotate(180deg);
  }

  .as-daily-detail-group > .as-daily-detail-list {
    padding: 0 10px 10px;
    background: linear-gradient(180deg, rgba(245, 248, 253, 0.35), rgba(238, 243, 250, 0.8));
  }

  .as-daily-detail-group-placeholder {
